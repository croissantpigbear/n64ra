# Push a tag like v1.0 and GitHub builds the Mac app and publishes a
# release with it and the two SC64 menus attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (it is created if it does not exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build N64RA Bridge.app
        run: bash app/build_mac.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cp menu/sc64menu.n64 sc64menu-trophynight.n64
          cp menu/sc64menu-goldrush.n64 sc64menu-goldrush.n64
          cat > notes.md <<'NOTES'
          RetroAchievements on a real Nintendo 64 through a SummerCart64.

          **Downloads**

          - **N64RA-Bridge-mac.zip** – the bridge as a Mac app (Intel and Apple silicon, Python included). Unzip, drag to Applications, press Start. The first time, macOS refuses it once: System Settings › Privacy & Security › Open Anyway.
          - **sc64menu-trophynight.n64** / **sc64menu-goldrush.n64** – the SC64 menu with the RetroAchievements option, in either theme. Rename the one you want to `sc64menu.n64` and put it on the root of the SD card.

          You also need an Expansion Pak, a USB cable from the SC64 to the computer, and [xeRAbora](https://github.com/hacan359/xerabora) (the app can download it). For box art and descriptions in the menu, add the [metadata pack](https://github.com/n64-tools/n64-flashcart-menu-metadata/releases) to `menu/` on the SD card.

          On other computers, run `bridge/n64ra_bridge.py` with Python 3 and pyserial. See the README.
          NOTES
          sed -i '' 's/^          //' notes.md
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes
          gh release create "$TAG" --title "n64ra $TAG" --notes-file notes.md \
            app/dist/N64RA-Bridge-mac.zip sc64menu-trophynight.n64 sc64menu-goldrush.n64
